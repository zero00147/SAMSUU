<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>samsu</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">samsu</div>
        <button class="icon-btn" id="collapse-btn" title="Hide sidebar" aria-label="Hide sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat-btn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="chat-list" id="chat-list"></div>

      <div class="sidebar-foot">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">connecting…</span>
      </div>
    </aside>

    <main class="main">
      <button class="icon-btn floating-toggle" id="expand-btn" title="Show sidebar" aria-label="Show sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      </button>

      <div class="scroll" id="scroll">
        <div class="thread" id="thread"></div>

        <div class="empty" id="empty">
          <h1>How can I help you today?</h1>
          <p>Running locally on Qwen3-4B. Nothing leaves your machine.</p>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <textarea id="input" rows="1" placeholder="Reply to samsu…"></textarea>
          <button class="think-toggle" id="think-btn" title="Extended thinking — slower, better on hard problems" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3a6 6 0 0 0-4 10.5V17h8v-3.5A6 6 0 0 0 12 3zM9.5 20h5"/></svg>
            Think
          </button>
          <button class="send" id="send-btn" title="Send" aria-label="Send">
            <svg class="ic-send" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="ic-stop" viewBox="0 0 24 24" width="18" height="18"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </button>
        </div>
        <div class="disclaimer">samsu runs offline and can make mistakes. Verify important information.</div>
      </div>
    </main>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/dompurify.min.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
