<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>samsu</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">samsu</div>
        <button class="icon-btn" id="collapse-btn" title="Hide sidebar" aria-label="Hide sidebar">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat-btn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="chat-list" id="chat-list"></div>

      <div class="sidebar-foot">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">connecting…</span>
      </div>
    </aside>

    <main class="main">
      <button class="icon-btn floating-toggle" id="expand-btn" title="Show sidebar" aria-label="Show sidebar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      </button>

      <div class="status-pill" id="status-pill" role="status" aria-live="polite" hidden>
        <span class="status-spinner" id="status-spinner"></span>
        <span class="status-label" id="status-label">Thinking</span>
        <span class="status-elapsed" id="status-elapsed">0.0s</span>
      </div>

      <div class="scroll" id="scroll">
        <div class="thread" id="thread"></div>

        <div class="empty" id="empty">
          <h1>How can I help you today?</h1>
          <p>Running locally on Qwen3-4B. Nothing leaves your machine.</p>
        </div>
      </div>

      <div class="composer-wrap">
        <div class="chips" id="chips"></div>

        <div class="composer" id="composer">
          <button class="attach-btn" id="attach-btn" title="Attach document sections" aria-label="Attach document sections">
            <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21 11.5l-8.8 8.8a5 5 0 0 1-7.1-7.1l9.2-9.2a3.3 3.3 0 0 1 4.7 4.7l-9.2 9.2a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Reply to samsu…"></textarea>
          <button class="think-toggle" id="think-btn" title="Extended thinking — slower, better on hard problems" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 3a6 6 0 0 0-4 10.5V17h8v-3.5A6 6 0 0 0 12 3zM9.5 20h5"/></svg>
            Think
          </button>
          <button class="send" id="send-btn" title="Send" aria-label="Send">
            <svg class="ic-send" viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg class="ic-stop" viewBox="0 0 24 24" width="18" height="18"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
          </button>
        </div>
        <div class="disclaimer">
          <span id="budget-note"></span>
          samsu runs offline and can make mistakes. Verify important information.
        </div>
      </div>
    </main>
  </div>

  <div class="overlay" id="docs-overlay" hidden>
    <div class="docs-panel" role="dialog" aria-label="Attach document sections">
      <div class="docs-head">
        <strong>Attach reference</strong>
        <button class="icon-btn" id="docs-close" aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div class="docs-body">
        <label class="upload-zone" id="upload-zone">
          <input type="file" id="file-input" accept=".pdf,.docx,.md,.txt,.markdown,.rst" hidden>
          <span id="upload-text">Upload a document — PDF, DOCX, MD, TXT</span>
        </label>
        <div class="docs-list" id="docs-list"></div>
      </div>

      <div class="docs-foot">
        <span class="budget" id="budget-bar">Nothing attached</span>
        <button class="btn primary" id="docs-done">Done</button>
      </div>
    </div>
  </div>

  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/dompurify.min.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/status.js"></script>
  <script src="/js/docs.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
